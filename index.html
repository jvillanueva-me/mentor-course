<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A self-paced six-lesson course on finding a mentor and becoming an effective mentee.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Supercharging Your Career With a Mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: persistent lesson rail on the left (drawer on small screens); each view opens with a photo hero, then a centered 720px reading column of blocks. */
:root {
  --navy: #0f1e36;
  --navy-2: #182b4a;
  --bg: #f5f7f6;
  --surface: #ffffff;
  --mist: #e3e9ee;
  --mist-2: #cfd8e0;
  --ink: #14223a;
  --ink-soft: #4a5a70;
  --teal: #137371;
  --teal-soft: #dff1ef;
  --aqua: #5ccfc6;
  --gold: #e3ae45;
  --gold-ink: #1a1508;
  --gold-soft: #fbf0d9;
  --ok: #1d7a52;
  --ok-soft: #e1f3ea;
  --bad: #b0413e;
  --bad-soft: #f8e5e3;
  --on-photo: #ffffff;
  --overlay: 15, 30, 54;
  --shadow: 0 1px 2px rgba(15, 30, 54, .06), 0 8px 24px rgba(15, 30, 54, .07);
  --shadow-lift: 0 2px 4px rgba(15, 30, 54, .08), 0 16px 36px rgba(15, 30, 54, .12);
  --ring: 0 0 0 3px var(--bg), 0 0 0 5px var(--teal);
  --rail-bg: var(--navy);
  --rail-ink: #e8eef4;
  --rail-soft: #9fb0c4;
  --reflect-bg: var(--navy);
  --reflect-ink: #eef3f7;

  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;

  --t-xs: .8125rem; --t-sm: .9375rem; --t-md: 1.0625rem; --t-lg: 1.25rem;
  --t-xl: 1.625rem; --t-2xl: 2.125rem; --t-3xl: clamp(2.25rem, 4.6vw, 3.5rem);
  --radius: 18px; --radius-sm: 12px;
  --read: 720px;
  --rail: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1526; --surface: #13223a; --mist: #1b2d48; --mist-2: #2a3f5f;
    --ink: #e9eef4; --ink-soft: #a9b7c9; --teal: #5ccfc6; --teal-soft: #123a44;
    --gold-soft: #3a2f17; --ok: #6fd3a1; --ok-soft: #12382a; --bad: #f19a95; --bad-soft: #432023;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.35), 0 16px 36px rgba(0,0,0,.35);
    --rail-bg: #081120; --reflect-bg: #172a47;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1526; --surface: #13223a; --mist: #1b2d48; --mist-2: #2a3f5f;
  --ink: #e9eef4; --ink-soft: #a9b7c9; --teal: #5ccfc6; --teal-soft: #123a44;
  --gold-soft: #3a2f17; --ok: #6fd3a1; --ok-soft: #12382a; --bad: #f19a95; --bad-soft: #432023;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --shadow-lift: 0 2px 4px rgba(0,0,0,.35), 0 16px 36px rgba(0,0,0,.35);
  --rail-bg: #081120; --reflect-bg: #172a47;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: var(--t-md); line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--rail-bg); }
h1, h2, h3 { font-family: var(--display); font-weight: 500; line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow { font-size: var(--t-xs); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--gold); color: var(--gold-ink); padding: 10px 16px; border-radius: 10px; font-weight: 600; text-decoration: none; }
.skip:focus { top: calc(12px + env(safe-area-inset-top, 0px)); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto;
  background: var(--rail-bg); color: var(--rail-ink);
  padding: 28px 20px 24px max(20px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 24px;
}
.rail-brand { display: flex; flex-direction: column; gap: 6px; text-decoration: none; padding: 4px 8px; }
.rail-brand .eyebrow { color: var(--aqua); font-size: .6875rem; }
.rail-brand strong { font-family: var(--display); font-weight: 500; font-size: 1.25rem; line-height: 1.2; }
.rail-progress { padding: 0 8px; display: grid; gap: 8px; }
.rail-progress .row { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--rail-soft); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--aqua), var(--gold)); border-radius: inherit; transition: width .5s ease; }
.rail nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rail-link {
  display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 12px; align-items: center;
  padding: 10px 10px; border-radius: 12px; text-decoration: none; color: var(--rail-soft);
  font-size: var(--t-sm); line-height: 1.35; transition: background .15s, color .15s;
}
.rail-link:hover { background: rgba(255,255,255,.06); color: var(--rail-ink); }
.rail-link[aria-current="page"] { background: rgba(92,207,198,.14); color: #fff; }
.rail-link .dot {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid rgba(255,255,255,.22); font-size: var(--t-xs); font-weight: 700; font-variant-numeric: tabular-nums;
}
.rail-link[aria-current="page"] .dot { border-color: var(--aqua); color: var(--aqua); }
.rail-link.done .dot { background: var(--aqua); border-color: var(--aqua); color: var(--navy); }
.rail-link .dot svg { width: 15px; height: 15px; }
.rail-link small { display: block; font-size: .6875rem; letter-spacing: .1em; text-transform: uppercase; opacity: .75; margin-bottom: 2px; }
.rail-home .dot svg { width: 16px; height: 16px; }
.rail-foot { margin-top: auto; padding: 0 8px; display: grid; gap: 10px; font-size: var(--t-xs); color: var(--rail-soft); }
.linkish { background: none; border: 0; padding: 0; color: var(--rail-soft); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; justify-self: start; font-size: var(--t-xs); }
.linkish:hover { color: var(--rail-ink); }
.reset-confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.reset-confirm button { border: 1px solid rgba(255,255,255,.25); background: transparent; color: var(--rail-ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: var(--t-xs); }
.reset-confirm button.yes { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }

.topbar { display: none; }
.rail-close { display: none; }
.scrim { display: none; }

@media (max-width: 1023px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .topbar {
    display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
    background: var(--rail-bg); color: var(--rail-ink);
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .topbar .title { flex: 1; min-width: 0; font-family: var(--display); font-size: 1.0625rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .mini { font-size: var(--t-xs); color: var(--rail-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .topbar .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 0; }
  .icon-btn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: transparent; color: inherit; cursor: pointer; }
  .icon-btn svg { width: 20px; height: 20px; }
  .rail {
    position: fixed; z-index: 50; top: 0; left: 0; bottom: 0; height: auto; width: min(320px, 88vw);
    padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-102%); visibility: hidden; transition: transform .28s ease, visibility 0s linear .28s;
    box-shadow: 0 0 40px rgba(0,0,0,.35);
  }
  .rail.open { transform: none; visibility: visible; transition: transform .28s ease; }
  .rail-brand { padding-right: 52px; }
  .rail-close { display: grid; position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; }
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8,17,32,.55); }
  .scrim.open { display: block; }
}

/* ---------- view basics ---------- */
main { min-width: 0; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 640px) { .gutter { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
.col { max-width: var(--read); margin-inline: auto; }
.col-wide { max-width: 1040px; margin-inline: auto; }

.hero { position: relative; isolation: isolate; color: var(--on-photo); overflow: hidden; background: var(--navy); }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(100deg, rgba(var(--overlay), .94) 0%, rgba(var(--overlay), .82) 45%, rgba(var(--overlay), .55) 100%); }
.hero-inner { padding-block: clamp(40px, 7vw, 88px) clamp(44px, 7vw, 96px); display: grid; gap: 18px; }
.hero .course-name { font-size: var(--t-xs); color: rgba(255,255,255,.72); letter-spacing: .04em; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 6px; }
.chip-on-photo { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); font-size: var(--t-xs); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.chip-on-photo.theme { background: transparent; border-color: transparent; padding-inline: 0; color: var(--aqua); }
.hero h1 { font-size: var(--t-3xl); max-width: 16ch; outline: none; }
.hero p.lede { font-size: var(--t-lg); line-height: 1.5; max-width: 54ch; color: rgba(255,255,255,.88); }
.hero .status-chip { font-size: var(--t-xs); color: rgba(255,255,255,.8); display: inline-flex; gap: 6px; align-items: center; }
.hero .status-chip svg { width: 15px; height: 15px; color: var(--aqua); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 12px 22px;
  border-radius: 99px; border: 1.5px solid transparent; font-weight: 600; font-size: var(--t-md); line-height: 1.2;
  text-decoration: none; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-gold { background: var(--gold); color: var(--gold-ink); box-shadow: 0 6px 18px rgba(227,174,69,.28); }
.btn-gold:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(227,174,69,.38); }
.btn-gold:active { transform: none; }
.btn-ghost-light { color: #fff; border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.04); }
.btn-ghost-light:hover { background: rgba(255,255,255,.12); }
.btn-outline { color: var(--ink); border-color: var(--mist-2); background: var(--surface); }
.btn-outline:hover { border-color: var(--teal); color: var(--teal); }
.btn-teal { background: var(--teal); color: var(--bg); }
.btn-teal:hover { filter: brightness(1.08); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

.section { padding-block: clamp(40px, 6vw, 72px); }
.section + .section { padding-top: 0; }
.stack { display: grid; gap: 20px; }
.stack-lg { display: grid; gap: clamp(40px, 6vw, 64px); }
.label { color: var(--teal); }
.h2 { font-size: var(--t-2xl); }
.h3 { font-size: var(--t-xl); }
.prose { color: var(--ink-soft); display: grid; gap: 16px; max-width: 65ch; }
.prose strong { color: var(--ink); }

/* essential idea */
.essential { background: var(--mist); border-radius: var(--radius); padding: clamp(24px, 4vw, 40px); display: grid; gap: 14px; position: relative; overflow: hidden; }
.essential .eyebrow { color: var(--teal); display: inline-flex; gap: 8px; align-items: center; }
.essential .eyebrow svg { width: 16px; height: 16px; }
.essential blockquote { margin: 0; font-family: var(--display); font-size: clamp(1.625rem, 3.4vw, 2.25rem); line-height: 1.2; color: var(--ink); text-wrap: balance; }
.essential p { color: var(--ink-soft); max-width: 60ch; }

/* teaching cards */
.cards, .flips { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { .cards, .flips { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { background: var(--surface); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); display: grid; gap: 10px; align-content: start; border: 1px solid transparent; }
.card .num { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); font-weight: 700; font-size: var(--t-sm); font-variant-numeric: tabular-nums; }
.card h3 { font-size: 1.3125rem; }
.card p { color: var(--ink-soft); font-size: var(--t-sm); line-height: 1.6; }

/* activity shell */
.activity { background: var(--surface); border-radius: calc(var(--radius) + 4px); box-shadow: var(--shadow); padding: clamp(22px, 4vw, 40px); display: grid; gap: 22px; border: 1px solid var(--mist); }
.activity-head { display: grid; gap: 8px; }
.activity-head .eyebrow { color: var(--teal); display: inline-flex; align-items: center; gap: 8px; }
.activity-head .eyebrow svg { width: 16px; height: 16px; }
.activity-head p { color: var(--ink-soft); }
.feedback { border-radius: var(--radius-sm); padding: 14px 16px; font-size: var(--t-sm); display: flex; gap: 12px; align-items: flex-start; }
.feedback svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
.feedback.ok { background: var(--ok-soft); color: var(--ok); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback.info { background: var(--gold-soft); color: var(--ink); }
.feedback.info svg { color: #b07d16; }
.feedback b { color: inherit; }
.feedback p { color: var(--ink); }
.feedback.ok p, .feedback.bad p { color: inherit; }

/* lesson 1 progressive reveal */
.reveal-list { display: grid; gap: 12px; list-style: none; margin: 0; padding: 0; }
.reveal-item { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 16px; padding: 18px; border-radius: var(--radius); border: 1.5px solid var(--mist); background: var(--bg); }
.reveal-item .n { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--mist); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.reveal-item h3 { font-size: 1.25rem; margin-bottom: 4px; outline: none; }
.reveal-item p { color: var(--ink-soft); font-size: var(--t-sm); }
.reveal-item.current { border-color: var(--teal); background: var(--surface); box-shadow: var(--shadow); }
.reveal-item.current .n { background: var(--teal); color: var(--bg); }
.reveal-item.locked { border-style: dashed; background: transparent; align-items: center; }
.reveal-item.locked .n { background: transparent; border: 1.5px dashed var(--mist-2); }
.reveal-item.locked .n svg { width: 16px; height: 16px; }
.reveal-item.locked span { color: var(--ink-soft); font-size: var(--t-sm); }
.steps-meter { display: flex; gap: 6px; }
.steps-meter i { flex: 1; height: 5px; border-radius: 99px; background: var(--mist); }
.steps-meter i.on { background: var(--teal); }
@media (prefers-reduced-motion: no-preference) {
  .reveal-item.just { animation: rise .4s ease both; }
  @keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
}

/* sorting */
.sort-bank { min-height: 72px; border: 1.5px dashed var(--mist-2); border-radius: var(--radius); padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; background: var(--bg); }
.sort-bank.empty::before { content: "All statements placed."; color: var(--ink-soft); font-size: var(--t-sm); align-self: center; padding-left: 4px; }
.sort-zones { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.zone { border-radius: var(--radius); background: var(--bg); border: 1.5px solid var(--mist); padding: 14px; display: grid; gap: 10px; align-content: start; min-height: 170px; transition: border-color .15s, background .15s; }
.zone h4 { margin: 0; font-size: var(--t-sm); font-weight: 700; }
.zone .zone-items { display: grid; gap: 8px; }
.zone.drop-ready { border-color: var(--teal); border-style: dashed; }
.zone.drag-over { border-color: var(--teal); background: var(--teal-soft); border-style: solid; }
.zone-btn { border: 1.5px dashed var(--teal); color: var(--teal); background: transparent; border-radius: 10px; padding: 8px 10px; font-size: var(--t-xs); font-weight: 600; cursor: pointer; }
.zone-btn:hover { background: var(--teal-soft); }
.sort-chip {
  display: inline-flex; align-items: center; gap: 8px; text-align: left; padding: 10px 14px; border-radius: 12px;
  border: 1.5px solid var(--mist-2); background: var(--surface); cursor: grab; font-size: var(--t-sm); font-weight: 500; line-height: 1.3;
  box-shadow: 0 1px 2px rgba(15,30,54,.06); transition: border-color .15s, box-shadow .15s, transform .15s;
}
.sort-chip:hover { border-color: var(--teal); }
.sort-chip[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-soft); box-shadow: 0 0 0 3px var(--teal-soft); }
.sort-chip.dragging { opacity: .5; }
.sort-chip svg { width: 16px; height: 16px; flex: none; }
.sort-chip .grip { color: var(--ink-soft); }
.sort-chip.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.sort-chip.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }

/* flip cards */
.flip { perspective: 1200px; border: 0; padding: 0; background: none; cursor: pointer; text-align: left; border-radius: var(--radius); display: grid; }
.flip-inner { display: grid; transition: transform .55s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; border-radius: var(--radius); }
.flip[aria-pressed="true"] .flip-inner { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius); padding: 22px; display: grid; gap: 12px; align-content: space-between; min-height: 230px; }
.face.front { background: var(--navy); color: #fff; }
.face.front q { font-family: var(--display); font-size: 1.375rem; line-height: 1.3; quotes: "“" "”"; }
.face.back { background: var(--teal-soft); color: var(--ink); transform: rotateY(180deg); border: 1.5px solid var(--teal); }
.face.back p { font-size: var(--t-sm); }
.face .hint { font-size: var(--t-xs); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; display: inline-flex; gap: 8px; align-items: center; }
.face.front .hint { color: var(--aqua); }
.face.back .hint { color: var(--teal); }
.face .hint svg { width: 15px; height: 15px; }
.flip:hover .face.front { background: var(--navy-2); }
.flip:focus-visible { box-shadow: var(--ring); }
@media (prefers-reduced-motion: reduce) {
  .flip-inner { transition: none; transform: none !important; }
  .face.back { transform: none; }
  .flip[aria-pressed="true"] .face.front, .flip[aria-pressed="false"] .face.back { visibility: hidden; }
}

/* option cards (radios) */
.options { display: grid; gap: 12px; border: 0; padding: 0; margin: 0; min-width: 0; }
.options legend { padding: 0; margin-bottom: 12px; font-weight: 700; font-size: var(--t-md); }
.opt { position: relative; display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 14px; align-items: start; padding: 16px 18px; border-radius: 14px; border: 1.5px solid var(--mist-2); background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--teal); }

        const reached = Math.min(S.l1, 3);
        const all = S.l1 >= 4;
        let html = `<div class="steps-meter" aria-hidden="true">${QUALITIES.map((_, i) => `<i class="${i <= reached || all ? "on" : ""}"></i>`).join("")}</div>
          <p class="sr-only">${all ? "All four qualities explored." : `Quality ${reached + 1} of 4 shown.`}</p>
          <ol class="reveal-list" style="margin-top:16px">`;
        QUALITIES.forEach((q, i) => {
          if (i <= reached) {
            const cur = i === reached && !all;
            html += `<li class="reveal-item${cur ? " current" : ""}${cur && focusNew ? " just" : ""}"><span class="n" aria-hidden="true">${i + 1}</span><div><h3 tabindex="-1" id="q-${i}">${q[0]}</h3><p>${q[1]}</p></div></li>`;
          } else {
            html += `<li class="reveal-item locked"><span class="n" aria-hidden="true">${I.lock}</span><span>Quality ${i + 1} unlocks next</span></li>`;
          }
        });
        html += `</ol><div class="btn-row" style="margin-top:20px">`;
        if (!all) {
          html += reached < 3
            ? `<button type="button" class="btn btn-teal" id="l1-next">Reveal quality ${reached + 2} of 4 ${I.arrow}</button>`
            : `<button type="button" class="btn btn-teal" id="l1-next">Finish exploring ${I.check}</button>`;
        } else {
          html += `<button type="button" class="btn btn-outline" id="l1-restart">Explore again</button>`;
        }
        html += `</div>`;
        if (all) html += `<div class="feedback ok" style="margin-top:16px">${I.checkCircle}<p><b>Nicely done.</b> Mentoring grows you over time, shifts how you think, asks something of both people, and builds momentum you can carry forward.</p></div>`;
        root.innerHTML = html;
        const nx = $("#l1-next", root), rs = $("#l1-restart", root);
        if (nx) nx.addEventListener("click", () => {
          S.l1 = Math.min(S.l1 + 1, 4); save(); draw(true);
          if (S.l1 < 4) { const h = $("#q-" + S.l1); h && h.focus(); }
          else { const b = $("#l1-restart"); b && b.focus(); announce("All four qualities explored."); }
        });
        if (rs) rs.addEventListener("click", () => { S.l1 = 0; save(); draw(false); $("#l1-next").focus(); });
      };
      draw(false);
    },

    2() {
      const root = $("#l2-sort");
      let selected = null;
      const placed = () => SORT_ITEMS.filter((it) => S.sort[it.id]);
      const chip = (it) => {
        const st = S.sortChecked && S.sort[it.id] ? (S.sort[it.id] === it.cat ? "right" : "wrong") : "";
        const icon = st === "right" ? I.check : st === "wrong" ? I.x : `<span class="grip">${I.grip}</span>`;
        const where = S.sort[it.id] ? SORT_CATS.find((c) => c.id === S.sort[it.id]).label : "not yet placed";
        const verdict = st === "right" ? ", correct" : st === "wrong" ? ", incorrect" : "";
        return `<button type="button" class="sort-chip ${st}" draggable="true" data-item="${it.id}" aria-pressed="${selected === it.id}" aria-label="${esc(it.text)}, ${esc(where)}${verdict}">${icon}<span>${esc(it.text)}</span></button>`;
      };
      const draw = (focusId) => {
        const bankItems = SORT_ITEMS.filter((it) => !S.sort[it.id]);
        const allPlaced = bankItems.length === 0;
        const correct = SORT_ITEMS.filter((it) => S.sort[it.id] === it.cat).length;
        let fb = "";
        if (S.sortChecked) {
          fb = correct === 6
            ? `<div class="feedback ok">${I.checkCircle}<p><b>All six sorted correctly.</b> Mentors offer perspective and experience. Preparation and action stay with you, and no mentor should make your decisions or do your work.</p></div>`
            : `<div class="feedback bad">${I.xCircle}<p><b>${correct} of 6 in the right place.</b> Statements marked with an × belong somewhere else. Select <b>Try again</b> to move them back.</p></div>`;
        } else if (selected) {
          const it = SORT_ITEMS.find((x) => x.id === selected);
          fb = `<div class="feedback info">${I.info}<p>“${esc(it.text)}” selected. Now choose a category below.</p></div>`;
        }
        root.innerHTML = `
          <div class="stack" style="gap:16px">
            <div><h3 class="eyebrow" style="font-family:var(--body);color:var(--ink-soft);margin-bottom:10px">Statements</h3>
              <div class="sort-bank${allPlaced ? " empty" : ""}" data-zone="bank">${bankItems.map(chip).join("")}</div>
            </div>
            <div class="sort-zones">
              ${SORT_CATS.map((c) => `<div class="zone${selected ? " drop-ready" : ""}" data-zone="${c.id}" role="group" aria-label="${esc(c.label)}">
                <h4>${esc(c.label)}</h4>
                <div class="zone-items">${SORT_ITEMS.filter((it) => S.sort[it.id] === c.id).map(chip).join("")}</div>
                ${selected && S.sort[selected] !== c.id ? `<button type="button" class="zone-btn" data-place="${c.id}">Place here</button>` : ""}
              </div>`).join("")}
            </div>
            ${selected && S.sort[selected] ? `<div><button type="button" class="btn btn-outline" data-place="bank" style="min-height:40px;padding:8px 16px;font-size:var(--t-sm)">Return to statements</button></div>` : ""}
            <div aria-live="polite">${fb}</div>
            <div class="btn-row">
              ${S.sortChecked
                ? (correct === 6 ? `<button type="button" class="btn btn-outline" id="sort-reset">Start over</button>` : `<button type="button" class="btn btn-teal" id="sort-retry">Try again</button>`)
                : `<button type="button" class="btn btn-teal" id="sort-check"${allPlaced ? "" : ' aria-disabled="true"'}>Check my sorting</button>
                   <span class="score">${placed().length} of 6 placed</span>`}
            </div>
          </div>`;
        if (focusId) { const el = $(focusId, root); if (el) el.focus(); }
      };
      const place = (id, zone) => {
        if (zone === "bank") delete S.sort[id]; else S.sort[id] = zone;
        S.sortChecked = false; selected = null; save();
        const it = SORT_ITEMS.find((x) => x.id === id);
        announce(zone === "bank" ? `${it.text} returned to statements.` : `${it.text} placed in ${SORT_CATS.find((c) => c.id === zone).label}`);
        draw(`[data-item="${id}"]`);
      };
      root.addEventListener("click", (e) => {
        const c = e.target.closest(".sort-chip");
        const p = e.target.closest("[data-place]");
        if (p && selected) { place(selected, p.dataset.place); return; }
        if (c) {
          if (S.sortChecked) return;
          const id = c.dataset.item;
          selected = selected === id ? null : id; draw(`[data-item="${id}"]`); return;
        }
        if (e.target.closest("#sort-check")) {
          if (placed().length < 6) { announce("Place all six statements before checking."); return; }
          S.sortChecked = true; save(); draw("#sort-retry, #sort-reset");
          const n = SORT_ITEMS.filter((it) => S.sort[it.id] === it.cat).length;
          announce(n === 6 ? "All six sorted correctly." : `${n} of 6 correct.`);
          return;
        }
        if (e.target.closest("#sort-retry")) {
          SORT_ITEMS.forEach((it) => { if (S.sort[it.id] !== it.cat) delete S.sort[it.id]; });
          S.sortChecked = false; save(); draw(".sort-bank .sort-chip"); return;
        }
        if (e.target.closest("#sort-reset")) { S.sort = {}; S.sortChecked = false; save(); draw(".sort-chip"); return; }
        const z = e.target.closest(".zone");
        if (z && selected) place(selected, z.dataset.zone);
      });
      root.addEventListener("keydown", (e) => { if (e.key === "Escape" && selected) { const id = selected; selected = null; draw(`[data-item="${id}"]`); } });
      /* native drag and drop for mouse */
      root.addEventListener("dragstart", (e) => {
        const c = e.target.closest(".sort-chip"); if (!c || S.sortChecked) { e.preventDefault(); return; }
        e.dataTransfer.setData("text/plain", c.dataset.item); e.dataTransfer.effectAllowed = "move";
        setTimeout(() => c.classList.add("dragging"), 0);
      });
      root.addEventListener("dragend", (e) => { const c = e.target.closest(".sort-chip"); if (c) c.classList.remove("dragging"); $$(".drag-over", root).forEach((z) => z.classList.remove("drag-over")); });
      root.addEventListener("dragover", (e) => { const z = e.target.closest("[data-zone]"); if (z) { e.preventDefault(); z.classList.add("drag-over"); } });
      root.addEventListener("dragleave", (e) => { const z = e.target.closest("[data-zone]"); if (z && !z.contains(e.relatedTarget)) z.classList.remove("drag-over"); });
      root.addEventListener("drop", (e) => { const z = e.target.closest("[data-zone]"); if (!z) return; e.preventDefault(); const id = e.dataTransfer.getData("text/plain"); if (id) place(id, z.dataset.zone); });
      draw();

      /* flip cards */
      const fl = $("#l2-flips");
      fl.innerHTML = FLIPS.map((f, i) => {
        const on = !!S.flips[i];
        return `<button type="button" class="flip" data-flip="${i}" aria-pressed="${on}" aria-label="Myth ${i + 1}: ${esc(f[0])}. ${on ? "Revealed: " + esc(f[1]) : "Select to reveal a better approach."}">
          <span class="flip-inner">
            <span class="face front" aria-hidden="true"><span class="hint">Common belief ${i + 1}</span><q>${esc(f[0])}</q><span class="hint">${I.flip} Tap to flip</span></span>
            <span class="face back" aria-hidden="true"><span class="hint">A better approach</span><p>${esc(f[1])}</p><span class="hint">${I.flip} Tap to flip back</span></span>
          </span></button>`;
      }).join("");
      fl.addEventListener("click", (e) => {
        const b = e.target.closest(".flip"); if (!b) return;
        const i = +b.dataset.flip; S.flips[i] = !S.flips[i]; save();
        b.setAttribute("aria-pressed", String(S.flips[i]));
        b.setAttribute("aria-label", `Myth ${i + 1}: ${FLIPS[i][0]}. ${S.flips[i] ? "Revealed: " + FLIPS[i][1] : "Select to reveal a better approach."}`);
        if (S.flips[i]) announce(FLIPS[i][1]);
      });
    },

    3() {
      const out = $("#l3-result");
      const draw = () => {
        const m = MATCH.find((x) => x.id === S.match);
        out.innerHTML = m ? `<div class="result"><span class="eyebrow">Your next step · ${m.t}</span><p>${m.next}</p></div>`
          : `<div class="feedback info">${I.info}<p>Choose an option to see a focused next step.</p></div>`;
      };
      $("#l3-opts").addEventListener("change", (e) => { S.match = e.target.value; save(); draw(); });
      draw();
      $("#l3-play").addEventListener("click", () => { $("#l3-soon").hidden = false; });
    },

    4() {
      const draw = () => {
        const n = HABITS.filter((_, i) => S.habits[i]).length;
        $("#l4-bar").style.width = (n / 4 * 100) + "%";
        $("#l4-count").textContent = `${n} of 4 habits selected`;
        $("#l4-fb").innerHTML = `<div class="feedback ${n === 4 ? "ok" : "info"}">${n === 4 ? I.checkCircle : I.spark}<p>${HABIT_FEEDBACK[n]}</p></div>`;
      };
      $("#l4-habits").addEventListener("click", (e) => {
        const b = e.target.closest(".habit"); if (!b) return;
        const i = +b.dataset.habit; S.habits[i] = !S.habits[i]; save();
        b.setAttribute("aria-pressed", String(!!S.habits[i])); draw();
      });
      draw();
    },

    5() {
      const drawScore = () => {
        const n = SCENARIOS.filter((sc) => S.scenChecked[sc.id] && S.scen[sc.id] === sc.right).length;
        $("#l5-score").textContent = `${n} of 2 scenarios solved${n === 2 ? ". Great coaching instincts." : ""}`;
      };
      const drawOne = (sc) => {
        const box = $("#sc-" + sc.id);
        const fbEl = $(".sc-fb", box);
        $$(".opt", box).forEach((o) => o.classList.remove("is-right", "is-wrong"));
        if (!S.scenChecked[sc.id] || S.scen[sc.id] === undefined) { fbEl.innerHTML = ""; return; }
        const pick = S.scen[sc.id];
        const ok = pick === sc.right;
        $(`.opt[data-oi="${pick}"]`, box).classList.add(ok ? "is-right" : "is-wrong");
        fbEl.innerHTML = ok
          ? `<div class="feedback ok">${I.checkCircle}<p><b>Strongest move.</b> ${sc.fb}</p></div>`
          : `<div class="feedback bad">${I.xCircle}<p><b>Not the strongest move.</b> ${sc.hint} Choose another option and check again.</p></div>`;
      };
      SCENARIOS.forEach((sc) => {
        const box = $("#sc-" + sc.id);
        box.addEventListener("change", (e) => {
          S.scen[sc.id] = +e.target.value; S.scenChecked[sc.id] = false; save(); drawOne(sc); drawScore();
        });
        $(`[data-check="${sc.id}"]`, box).addEventListener("click", () => {
          if (S.scen[sc.id] === undefined) { $(".sc-fb", box).innerHTML = `<div class="feedback info">${I.info}<p>Choose an option first.</p></div>`; return; }
          S.scenChecked[sc.id] = true; save(); drawOne(sc); drawScore();
        });
        drawOne(sc);
      });
      drawScore();
    },

    6() {
      const out = $("#l6-out");
      const draw = () => {
        if (S.focus && S.commit) {
          const plan = `My next step: I will focus on ${S.focus} and commit to ${S.commit}.`;
          out.innerHTML = `<span class="eyebrow">Your action plan</span><p class="plan">${esc(plan)}</p>
            <div class="btn-row"><button type="button" class="btn btn-gold" id="l6-copy">Copy my plan</button><span id="l6-copied" style="font-size:var(--t-sm);color:var(--aqua)"></span></div>`;
          $("#l6-copy").addEventListener("click", () => {
            const done = () => { $("#l6-copied").textContent = "Copied to clipboard"; };
            const fallback = () => { const r = document.createRange(); r.selectNodeContents($(".plan", out)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("#l6-copied").textContent = "Selected. Press Ctrl+C or ⌘C to copy."; };
            try { navigator.clipboard.writeText(plan).then(done, fallback); } catch (e) { fallback(); }
          });
        } else {
          const need = !S.focus && !S.commit ? "a focus and a commitment" : !S.focus ? "a focus" : "a commitment";
          out.innerHTML = `<span class="eyebrow">Your action plan</span><p class="wait">Choose ${need} to build your plan.</p>`;
        }
      };
      $("#l6-focus").addEventListener("change", (e) => { S.focus = e.target.value; save(); draw(); });
      $("#l6-commit").addEventListener("change", (e) => { S.commit = e.target.value; save(); draw(); });
      draw();
    }
  };

  render(false);
})();
</script>
</body>
</html>
